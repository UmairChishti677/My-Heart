<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Click me</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#fff0f5; --bg2:#ffd6e5; --text:#b0275c; --hint:#c0507f; --glow:rgba(255,105,160,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg1:#2a0f1c; --bg2:#4a1630; --text:#ff9fc4; --hint:#ff8ab6; --glow:rgba(255,105,160,.5); }
}
:root[data-theme="dark"]{ --bg1:#2a0f1c; --bg2:#4a1630; --text:#ff9fc4; --hint:#ff8ab6; --glow:rgba(255,105,160,.5); }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(circle at 50% 40%,var(--bg1),var(--bg2));
  color:var(--text);
  font-family:'Quicksand',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:1rem;text-align:center}
.heart{
  all:unset;cursor:pointer;
  font-size:min(38vw,190px);line-height:1;
  filter:drop-shadow(0 12px 28px var(--glow));
  animation:beat 1.6s ease-in-out infinite;
  transition:transform .15s;
  -webkit-tap-highlight-color:transparent;
}
.heart:focus-visible{outline:3px solid var(--text);outline-offset:8px;border-radius:50%}
.heart:active{transform:scale(.88)}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.1)}28%{transform:scale(1)}42%{transform:scale(1.07)}70%{transform:scale(1)}}
.hint{font-size:1.35rem;font-weight:600;color:var(--hint);letter-spacing:.02em}
.love{
  position:absolute;left:50%;top:0;
  font-family:'Dancing Script',cursive,serif;font-weight:700;
  font-size:clamp(2.2rem,9vw,3.6rem);white-space:nowrap;
  color:var(--text);pointer-events:none;
  text-shadow:0 2px 14px var(--glow);
  opacity:0;transform:translate(-50%,0) scale(.5);
}
.love.go{animation:rise 2.4s ease-out forwards}
@keyframes rise{
  0%{opacity:0;transform:translate(-50%,40px) scale(.4)}
  20%{opacity:1;transform:translate(-50%,-30px) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-190px) scale(1)}
}
.mini{position:fixed;pointer-events:none;font-size:1.6rem;animation:fly 1.8s ease-out forwards}
@keyframes fly{
  from{opacity:1;transform:translate(0,0) scale(.6)}
  to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}
}
@media (prefers-reduced-motion: reduce){
  .heart{animation:none}
  .mini{display:none}
}
</style>
</head>
<body>
<main class="stage">
  <div id="love" class="love" aria-live="polite">I love you</div>
  <button id="heart" class="heart" aria-label="Click me">🩷</button>
  <p class="hint">Click me</p>
</main>
<script>
(function(){
  var heart=document.getElementById('heart'), love=document.getElementById('love');
  var emojis=['🩷','💖','💕','💗'];
  heart.addEventListener('click',function(e){
    love.classList.remove('go'); void love.offsetWidth; love.classList.add('go');
    var r=heart.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
    for(var i=0;i<12;i++){
      var m=document.createElement('span');
      m.className='mini';
      m.textContent=emojis[i%emojis.length];
      var a=(Math.PI*2*i)/12, d=90+Math.random()*90;
      m.style.left=cx+'px'; m.style.top=cy+'px';
      m.style.setProperty('--dx',Math.cos(a)*d+'px');
      m.style.setProperty('--dy',Math.sin(a)*d+'px');
      document.body.appendChild(m);
      setTimeout(function(el){el.remove()},1900,m);
    }
  });
})();
</script>
</body>
</html>
